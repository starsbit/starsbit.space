# Static site. Asset names are not content-hashed, so html/js/css revalidate on every load (ETag / 304);
# pictures, sprites and music change rarely: 1 day.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:html|js|css|json|txt)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|mp3|woff2?)$ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
}
