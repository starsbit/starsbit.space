# Builds the production image (Dockerfile) so a broken image never reaches the homelab cluster, which deploys a
# master commit only after these checks pass (pull-based autobuild on k3s "shipyard").  The release workflow
# runs it too, before it makes a release of a version tag.
name: docker-image
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t starsbit-space:ci .

      - name: Smoke test
        run: |
          docker run -d --name site -p 8080:8080 starsbit-space:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          for p in / /css/style.css /js/painting.js /js/scenes.js /assets/You.mp3 /assets/starsbit-black-cropped.svg \
                   /assets/music-note.svg /assets/paintings/overlook-summer.webp /assets/paintings/overlook-mask.png \
                   /assets/sprites/leaf-1.png; do
            curl -fs -o /dev/null "http://localhost:8080$p" || { echo "GET $p failed"; docker logs site; exit 1; }
          done
